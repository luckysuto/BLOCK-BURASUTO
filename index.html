<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07162f"><title>ブロックブラすと</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><button id="back" class="icon hidden">‹</button><div class="brand">ブロックブラ<span>すと</span><small>BLOCK BURASTO</small></div><div class="coins">✦ <span id="coins">0</span>P</div></header><main><section id="home" class="screen active"><div class="hero"><div class="hero-blocks">▦ ✦ ▣</div><h1>ブロックブラすと</h1><p>ブロックを置いて、最高の一手を。</p></div><button class="primary wide" data-go="classic">クラシックで遊ぶ</button><button class="purple wide" data-go="stages">ステージモード</button><div class="nav-grid"><button data-go="shop">🛒 ショップ</button><button data-go="settings">⚙ 設定</button></div><div class="panel stats"><div>最高スコア<strong id="best">0</strong></div><div>プレイ回数<strong id="plays">0</strong></div><div>累計スコア<strong id="total">0</strong></div></div></section><section id="game" class="screen"><div class="game-top"><div>スコア<strong id="score">0</strong></div><div>コンボ<strong id="combo">0</strong></div><div id="goalBox">目標<strong id="goal">—</strong></div><button id="pause" class="icon">Ⅱ</button></div><div class="board-wrap"><div id="board" aria-label="8×8盤面"></div></div><div class="hint" id="gameHint">ブロックをタップしてから盤面をタップ。ドラッグでも配置できます。</div><div id="tray" class="tray"></div><button class="muted" id="exitGame">保存してホームへ</button></section><section id="stages" class="screen"><h2>ステージモード</h2><p class="sub">目標スコアに到達するとクリア！</p><div id="stageGrid" class="stage-grid"></div></section><section id="shop" class="screen"><h2>ショップ</h2><div id="shopTabs" class="tabs"></div><div id="shopItems" class="shop-grid"></div><div id="playlist" class="panel hidden"><h3>BGMプレイリスト</h3><p class="sub">購入済みの曲をチェックして再生順を決めよう。</p><div id="playlistItems"></div><label><input id="shuffle" type="checkbox"> シャッフル再生</label></div></section><section id="settings" class="screen"><h2>設定</h2><div class="panel form"><label>BGM音量 <input type="range" id="musicVolume" min="0" max="100"></label><label>効果音量 <input type="range" id="sfxVolume" min="0" max="100"></label><label>演出 <select id="effects"><option value="low">控えめ</option><option value="medium">普通</option><option value="high">派手</option></select></label><label>テーマ <select id="theme"><option value="dark">ダーク</option><option value="light">ライト</option></select></label><label>振動 <input type="checkbox" id="vibrate"></label></div><div class="panel"><h3>データ管理</h3><button id="exportSave">バックアップを保存</button><label class="import">バックアップを読み込む<input id="importSave" type="file" accept="application/json"></label></div></section></main><div id="toast" role="status"></div><div id="modal" class="overlay hidden"><div class="dialog"><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalButtons"></div></div></div></div><script type="module" src="main.js"></script></body></html>
